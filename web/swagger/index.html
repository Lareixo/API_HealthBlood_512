<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API HealthBlood 512 | Swagger UI</title>
  <link rel="stylesheet" href="./swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }

    .api-banner {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding: 12px 24px;
      background: linear-gradient(90deg, #0f2350 0%, #1d4ed8 60%, #7c3aed 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 2px 10px rgba(15, 35, 80, 0.25);
    }

    .api-banner strong { font-size: 16px; letter-spacing: 0.3px; }
    .api-banner span { font-size: 13px; opacity: 0.9; }
    .api-banner a {
      margin-left: auto;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      padding: 5px 12px;
      transition: background 0.2s ease;
    }
    .api-banner a:hover { background: rgba(255, 255, 255, 0.15); }

    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 28px 0; }
    .swagger-ui .info .title { color: #0f2350; }
    .swagger-ui .btn.authorize { border-color: #2563eb; color: #2563eb; }
    .swagger-ui .btn.authorize svg { fill: #2563eb; }
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #2563eb; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #16a34a; }
    .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #d97706; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #dc2626; }
  </style>
</head>
<body>
  <div class="api-banner">
    <strong>API HealthBlood 512</strong>
    <span>Prueba todos los endpoints: usuarios, medidas y sistema</span>
    <a href="../">Volver al inicio</a>
  </div>
  <div id="swagger-ui"></div>

  <script src="./swagger-ui-bundle.js"></script>
  <script src="./swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        tryItOutEnabled: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        docExpansion: 'list',
        filter: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1
      });
    };
  </script>
</body>
</html>
